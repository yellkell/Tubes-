<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0a07" />
    <title>TUBES</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔧%3C/text%3E%3C/svg%3E"
    />
    <style>
      /*
       * THE DOOR — the one flatscreen page in TUBES.
       *
       * IT SHOWS THE TUBES. Three runs cross the frame, one per LINE, in
       * the lines' own colours straight off config.ts: MAINS furnace
       * amber, COOLANT glacier cyan, VOLT violet plasma. Each is a real
       * telescoping run — five sections stepping DOWN in bore toward the
       * head, a collar over every joint, frosted metal over a hot core of
       * liquid — and each pours at its own line's pace (MAINS slow and
       * heavy, COOLANT fast, VOLT fastest), which is the one thing the
       * three lines are actually different at.
       *
       * The word sits over the run, the key sits under it, and that is
       * the whole page. It has no plate and no tagline: a page for a game
       * about hauling pipe should be pipe.
       *
       * The contract with main.ts is unchanged: #enter-ar is the one
       * control, and .landing hides itself the moment body carries
       * .app-entered.
       */
      :root {
        color-scheme: dark;
        --iron: #0b0a07;
        --stencil: #fdf6ec;
        --tape-dark: #171216;
        /* THE LINES — config.ts LINES, glow / deep / foam, unchanged. */
        --mains: #ffa22e;
        --coolant: #46e0ff;
        --volt: #b46bff;
        --on-amber: #221103;
        /* Rajdhani arrives with the bundle (ui/fonts.ts puts the faces on
           the document), so the page paints in the same Arial Black
           fallback every canvas panel does and swaps with them. */
        --face: 'Rajdhani', 'Arial Black', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--iron);
        font-family: var(--face);
      }
      #scene-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 28% 22%, rgba(255, 162, 46, 0.14), transparent 28rem),
          radial-gradient(circle at 74% 72%, rgba(70, 224, 255, 0.1), transparent 24rem),
          linear-gradient(150deg, #0a0906 0%, #12100a 55%, #0a0d0e 100%);
      }

      /* ── the shop wall ─────────────────────────────────────────────── */
      .landing {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(20px, 4vh, 44px);
        padding: clamp(16px, 5vw, 48px) 0;
        box-sizing: border-box;
        overflow: hidden;
        background: linear-gradient(180deg, #100d09 0%, #0b0a07 46%, #060504 100%);
        transition:
          opacity 220ms ease,
          visibility 220ms ease;
      }
      body.app-entered .landing {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* The corners sink away, so the lit run is the only thing here. */
      .landing::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(122% 92% at 50% 46%, transparent 40%, rgba(0, 0, 0, 0.66));
      }

      /* ── the word ──────────────────────────────────────────────────── */
      .landing__word {
        position: relative;
        z-index: 2;
        display: block;
        font-family: var(--face);
        font-weight: 700;
        font-size: clamp(56px, 15vw, 190px);
        line-height: 0.9;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
        color: var(--stencil);
        user-select: none;
        text-shadow:
          0 3px 0 rgba(0, 0, 0, 0.55),
          0 4px 18px rgba(0, 0, 0, 0.6);
      }

      /* ── the runs ──────────────────────────────────────────────────── */
      /* Full-bleed: pipe enters the frame and leaves it, the way plant
         does. Nothing here is ever capped on screen. */
      .runs {
        position: relative;
        z-index: 1;
        width: 100vw;
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 1.7vh, 20px);
        pointer-events: none;
      }
      .run {
        display: flex;
        align-items: center;
        width: 112%;
        margin-left: -6%;
      }
      /* COOLANT runs the other way — three runs all tapering to the same
         side reads as a chart, not a shop. */
      .run--coolant {
        flex-direction: row-reverse;
        margin-left: -6%;
      }
      .run--mains {
        --glow: var(--mains);
        --deep: #571f02;
        --foam: #ffe9c4;
        --halo: rgba(255, 162, 46, 0.5);
        --bore: clamp(52px, 9.2vh, 104px);
        --pace: 7s; /* MAINS is slow and heavy */
      }
      .run--coolant {
        --glow: var(--coolant);
        --deep: #043346;
        --foam: #dcf8ff;
        --halo: rgba(70, 224, 255, 0.44);
        --bore: clamp(44px, 7.8vh, 88px);
        --pace: 4.2s; /* COOLANT is fast and bright */
      }
      .run--volt {
        --glow: var(--volt);
        --deep: #2a0b4e;
        --foam: #efe0ff;
        --halo: rgba(180, 107, 255, 0.46);
        --bore: clamp(37px, 6.6vh, 74px);
        --pace: 3.2s; /* VOLT travels in packets, and bites */
      }

      /* ONE SECTION of a telescoping run. The bore steps down toward the
         head (--f), and the section is METAL FIRST: an opaque cylinder,
         dark at both rims where the barrel turns away, a specular high
         up where the work light catches it and a bounce low down off the
         floor. The liquid is not the pipe — it glows through a window in
         the middle of it, which is the whole look inside: a pour riding
         behind frosted metal, never a lit rod. */
      .sec {
        position: relative;
        flex: 1 1 0;
        height: calc(var(--bore) * var(--f));
        background: linear-gradient(
          180deg,
          #060504 0%,
          #17130f 5%,
          #453d35 14%,
          #8d8175 23%,
          #6b6257 30%,
          #453e36 39%,
          #2b2620 47%,
          #241f1a 57%,
          #383129 68%,
          #4b443b 78%,
          #221d19 89%,
          #050403 100%
        );
        box-shadow:
          0 0 40px -6px var(--halo),
          inset 0 1px 0 rgba(255, 255, 255, 0.09);
      }
      /* THE WINDOW: the pour, seen through the frost. A narrow hot band
         down the barrel's middle — deep at its edges, the line's glow
         either side of a foam-white centreline. */
      .sec > i {
        position: absolute;
        inset: 35% 0;
        display: block;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.55) 0%,
          var(--deep) 12%,
          var(--glow) 34%,
          var(--foam) 50%,
          var(--glow) 66%,
          var(--deep) 88%,
          rgba(0, 0, 0, 0.55) 100%
        );
        opacity: 0.94;
        filter: blur(0.4px);
      }
      /* THE POUR: a front travelling the run at the line's own speed. */
      .sec > i::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.42) 50%,
          transparent 100%
        );
        background-size: 40% 100%;
        background-repeat: no-repeat;
        animation: pour var(--pace) linear infinite;
      }
      @keyframes pour {
        from {
          background-position: -60% 0;
        }
        to {
          background-position: 160% 0;
        }
      }
      /* THE COLLAR over every joint — the fitting that covers the step in
         bore, standing proud of the barrel like the real one. */
      .sec::after {
        content: '';
        position: absolute;
        right: -7px;
        top: 50%;
        translate: 0 -50%;
        width: 14px;
        height: calc(100% + 12px);
        border-radius: 2px;
        background: linear-gradient(
          180deg,
          #070605 0%,
          #2b251f 9%,
          #6e6459 24%,
          #948779 33%,
          #5c534a 46%,
          #332d27 62%,
          #4a433a 76%,
          #1c1814 90%,
          #060504 100%
        );
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      }
      .run > .sec:last-child::after {
        display: none;
      }
      .run--coolant > .sec::after {
        right: auto;
        left: -0.4em;
      }
      .run--coolant > .sec:last-child::after {
        display: none;
      }

      /* ── the key ───────────────────────────────────────────────────── */
      /* Solid amber on dark text: the board's own primary button, the one
         it uses inside for START JOB. */
      #enter-ar {
        position: relative;
        z-index: 2;
        appearance: none;
        border: 0;
        border-radius: 2px;
        padding: clamp(16px, 2.1vh, 20px) clamp(46px, 8vw, 76px);
        font-family: var(--face);
        font-weight: 700;
        font-size: clamp(18px, 2.3vw, 25px);
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        color: var(--on-amber);
        background: linear-gradient(180deg, #ffc470 0%, var(--mains) 52%, #e0810f 100%);
        cursor: pointer;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.42),
          0 4px 0 #7d430b,
          0 12px 32px rgba(255, 162, 46, 0.26);
        transition:
          filter 120ms ease,
          translate 90ms ease,
          box-shadow 90ms ease;
      }
      #enter-ar:hover:not([disabled]) {
        filter: brightness(1.08);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.48),
          0 4px 0 #7d430b,
          0 14px 40px rgba(255, 162, 46, 0.4);
      }
      #enter-ar:active:not([disabled]) {
        translate: 0 3px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 1px 0 #7d430b,
          0 6px 18px rgba(255, 162, 46, 0.24);
      }
      #enter-ar:focus-visible {
        outline: 2px solid var(--stencil);
        outline-offset: 4px;
      }
      /* THE MACHINE IS OFF, not broken: a browser with no headset gets
         "XR unavailable" here (main.ts), and a dimmed amber key reads as
         a fault where cold iron reads as a control that isn't live. */
      #enter-ar[disabled] {
        background: linear-gradient(180deg, #241f18 0%, #191510 100%);
        color: rgba(250, 244, 235, 0.42);
        cursor: default;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 4px 0 #0a0806;
      }

      /* ── the site boundary ─────────────────────────────────────────── */
      /* The hazard tape the shop floor gets marked out with, run across
         the bottom of the frame: the floor starts here. Same 45°
         amber/black cycle floor/tape.ts paints onto the real bands. */
      .landing__tape {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: clamp(11px, 1.9vh, 18px);
        pointer-events: none;
        background: repeating-linear-gradient(
          45deg,
          var(--tape-dark) 0 15px,
          var(--mains) 15px 30px
        );
        opacity: 0.72;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 -16px 34px rgba(0, 0, 0, 0.5);
      }

      /* A phone's width can't carry five sections without the collars
         reading as a zip. Three, and the telescope still tells. */
      @media (max-width: 560px) {
        .run > .sec:nth-child(n + 4) {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sec > i::after {
          animation: none;
        }
        #enter-ar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div class="landing">
      <span class="landing__word">TUBES</span>
      <div class="runs" aria-hidden="true">
        <div class="run run--mains">
          <span class="sec" style="--f: 1"><i></i></span>
          <span class="sec" style="--f: 0.86"><i></i></span>
          <span class="sec" style="--f: 0.73"><i></i></span>
          <span class="sec" style="--f: 0.62"><i></i></span>
          <span class="sec" style="--f: 0.53"><i></i></span>
        </div>
        <div class="run run--coolant">
          <span class="sec" style="--f: 1"><i></i></span>
          <span class="sec" style="--f: 0.85"><i></i></span>
          <span class="sec" style="--f: 0.72"><i></i></span>
          <span class="sec" style="--f: 0.61"><i></i></span>
          <span class="sec" style="--f: 0.52"><i></i></span>
        </div>
        <div class="run run--volt">
          <span class="sec" style="--f: 1"><i></i></span>
          <span class="sec" style="--f: 0.84"><i></i></span>
          <span class="sec" style="--f: 0.71"><i></i></span>
          <span class="sec" style="--f: 0.6"><i></i></span>
          <span class="sec" style="--f: 0.51"><i></i></span>
        </div>
      </div>
      <button id="enter-ar">PLAY</button>
      <div class="landing__tape" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
